<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CoraBooks - Lector</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="preload" href="/fonts/JetBrainsMono-400-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/fonts/fonts.css" />
  <link rel="stylesheet" href="reader.css" />
</head>
<body>
  <header class="rtoolbar">
    <a class="rbtn rback" href="/" title="Volver a la biblioteca">&larr; <span class="rlabel">Biblioteca</span></a>
    <a class="rbtn rback" id="rBookLink" href="/" title="Ficha del libro">&#9636; <span class="rlabel">Ficha</span></a>
    <div class="rtitle" id="rTitle">Cargando&hellip;</div>
    <div class="rpager">
      <button class="rbtn" id="rPrev" title="Página anterior" aria-label="Página anterior">&#9650;</button>
      <input class="rpage" id="rPage" type="number" min="1" value="1" aria-label="Página" />
      <span class="rtotal" id="rTotal">/ &ndash;</span>
      <button class="rbtn" id="rNext" title="Página siguiente" aria-label="Página siguiente">&#9660;</button>
    </div>
    <div class="rzoom">
      <button class="rbtn" id="rZoomOut" title="Alejar" aria-label="Alejar">&minus;</button>
      <button class="rbtn rfit" id="rFit" title="Ajustar al ancho">Ancho</button>
      <button class="rbtn" id="rZoomIn" title="Acercar" aria-label="Acercar">+</button>
    </div>
    <a class="rbtn rdownload" id="rDownload" href="#" title="Descargar el archivo">&#11015; <span class="rlabel">Descargar</span></a>
  </header>

  <div class="rstatus" id="rStatus">Abriendo el libro&hellip;</div>

  <main class="rpages" id="rPages"></main>

  <div class="rerror hidden" id="rError">
    <h2>No se pudo abrir el libro</h2>
    <p id="rErrorMsg"></p>
    <p><a class="rbtn" id="rErrorDownload" href="#">Descargar el archivo</a> &nbsp; <a class="rbtn" href="/">Volver a la biblioteca</a></p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
  <script src="reader.js"></script>
</body>
</html>
